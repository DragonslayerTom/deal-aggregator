services:
  - type: web
    name: deal-aggregator-api
    env: docker
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: deal-aggregator-db
          property: connectionString
      - key: EXA_API_KEY
        value: "f78249b0-fb33-41b5-872a-d7871c24e50e"

  - type: web
    name: deal-aggregator-web
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: "https://deal-aggregator-n4rf.onrender.com/api"

databases:
  - name: deal-aggregator-db
    databaseName: deal_aggregator
    user: deal_user
